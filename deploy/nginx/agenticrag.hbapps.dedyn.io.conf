# Public ingress for the Production Agentic RAG demo: HTTPS on 443, proxied to the
# loopback-only Gradio container. Nothing else is proxied; the API, Airflow, OpenSearch,
# Dashboards, PostgreSQL and Redis have no location and no hostname here.
#
# Install with deploy/nginx/install.sh (stage "tls"); the certificate must already exist.
# Installed path: /etc/nginx/sites-available/agenticrag.hbapps.dedyn.io.conf

# Gradio 6 streams over SSE, not WebSocket; the upgrade headers are passed through only so
# an upgrade request would still work. Without one, the upstream connection is closed.
map $http_upgrade $agenticrag_connection {
    default upgrade;
    ''      close;
}

# Requests that do not name the public hostname (bare IP, scanners) get no response.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
}

# HTTP: answer ACME challenges, redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name agenticrag.hbapps.dedyn.io;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://agenticrag.hbapps.dedyn.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agenticrag.hbapps.dedyn.io;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/agenticrag.hbapps.dedyn.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenticrag.hbapps.dedyn.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:agenticrag_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Conservative headers only; no Content-Security-Policy, which Gradio's inline assets need tuning for.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gradio builds its asset and event URLs from these two headers.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agenticrag_connection;

        # Status updates are streamed; deliver each event as it arrives.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;

        # An agent run with a live arXiv fallback takes minutes. 600s sits above the
        # agent's ~540s budget so the application times out first, never the proxy.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
